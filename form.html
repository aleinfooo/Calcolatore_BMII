            display: flex;

            background-color: #f1f3f5;

        .main-container {

        /* Stile del titolo */
        h1 {

        .card {

        .form-group {

        /* Le label occupano una riga intera */
        label {
            display: block;
            width: 100%;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 14px;
        }

        /* Gli input occupano una riga intera */
        input {
            display: block;
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-family: inherit;
            font-size: 16px;
            color: #1f2328;
            background-color: #f9fafb;
            transition: border-color 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #1f2328;
        }

        /* Stile del pulsante di Submit */
        button[type="submit"] {
            display: block;
            width: 100%;
            background-color: #1f2328;
            color: #f1f3f5;
            padding: 12px;
            margin-top: 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button[type="submit"]:hover {
            background-color: #2c323a;
        }
    </style>

</head>
<body>

    <div class="main-container">
        <!-- Titolo della pagina -->
        <h1>Calcolatore BMI</h1>

        <!-- Box del calcolatore -->
        <div class="card">
            <form action="bmi.php" method="POST">
                <!-- Campo Nome -->
                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Es. Mario" required>
                </div>

                <!-- Campo Peso -->
                <div class="form-group">
                    <label for="peso">Peso (kg)</label>
                    <input type="number" id="peso" name="peso" step="0.1" placeholder="Es. 70" required>
                </div>

                <!-- Campo Altezza -->
                <div class="form-group">
                    <label for="altezza">Altezza (cm)</label>
                    <input type="number" id="altezza" name="altezza" placeholder="Es. 175" required>
                </div>

                <!-- Pulsante Submit -->
                <button type="submit">Calcola</button>
            </form>
        </div>
    </div>

</body>
